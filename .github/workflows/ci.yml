
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds the toolchain image once; both matrix legs pull the same tag.
  devcontainer-image:
    name: devcontainer image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      # Content-addressed tag so unrelated pushes reuse the pushed image instead of rebuilding it.
      # TODO: this can drift away easily. Maybe we build the image with Bazel so it handles this for us?
      - id: tag
        env:
          REPOSITORY: ${{ github.repository }}
          CONTENT_HASH: ${{ hashFiles('docker/Dockerfile', '.bazelversion') }}
        run: |
          repo="ghcr.io/${REPOSITORY}/devcontainer"
          digest=$(echo "$CONTENT_HASH" | cut -c1-16)
          {
            echo "exact=$repo:$digest"
            echo "floating=$repo:main"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.tag.outputs.exact }}
            ${{ steps.tag.outputs.floating }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: resolve
        env:
          REF: ${{ github.ref }}
          EXACT: ${{ steps.tag.outputs.exact }}
          FLOATING: ${{ steps.tag.outputs.floating }}
        run: |
          if [ "$REF" = 'refs/heads/main' ]; then
            echo "image=$EXACT" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Running on $FLOATING, the toolchain published from main. A Dockerfile change in this PR is built and checked, but only takes effect once merged. Consider creating a separate PR to update the Dockerfile and merge it first."
            echo "image=$FLOATING" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.name }}
    needs: devcontainer-image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      image: ${{ needs.devcontainer-image.outputs.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fastbuild
            config: ""
          - name: release
            config: "--config=release"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: bazel-${{ matrix.name }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-${{ matrix.name }}-

      - name: bazel build //...
        run: |
          bazel build ${{ matrix.config }} \
            --disk_cache="$HOME/.cache/bazel-disk" \
            --repository_cache="$HOME/.cache/bazel-repo" \
            --show_progress_rate_limit=10 \
            --announce_rc \
            //...

      - name: bazel test //...
        run: |
          bazel test ${{ matrix.config }} \
            --disk_cache="$HOME/.cache/bazel-disk" \
            --repository_cache="$HOME/.cache/bazel-repo" \
            --show_progress_rate_limit=10 \
            //...
